[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voclib-algorithm"
version = "0.1.0"
description = "Reproducible molecular-mixture distance experiments for odor and future SERS studies"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "scikit-learn>=1.6,<2", "rdkit>=2024.3"]

[project.optional-dependencies]
plots = ["matplotlib>=3.8,<4"]
snapshot = ["pandas>=2.2,<4", "pyarrow>=15"]
app = ["matplotlib>=3.8,<4"]
desktop = ["pillow>=10,<13", "joblib>=1.3,<2"]

[project.scripts]
voclib = "voclib.cli:main"
voclib-app = "voclib.app:main"
voclib-odor = "voclib.odor_edit:main"
voclib-editor = "voclib.odor_desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voclib = ["web/*"]
